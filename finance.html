<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance - INDONUSA</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:'Segoe UI',Arial;background:#EEF2F7;color:#222}
.topbar{background:linear-gradient(90deg,#d4af37 0%,#f7eb81 100%);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200}
.topbar h1{margin:0;font-size:16px;color:#000;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-back{background:#0A2F52;color:#fff;border:0;padding:9px 14px;border-radius:50px;font-weight:800;cursor:pointer;font-size:13px;white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
.card-atas{background:#fff;border-radius:12px;padding:12px 14px;position:sticky;top:52px;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,.12);border:1px solid #E6C87A}
.card-atas h3{margin:0 0 8px;font-size:15px}
.form-atas{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.form-atas label{font-size:11px;font-weight:800;color:#555;display:block;margin-bottom:3px}
.form-atas input,.form-atas select{width:100%;padding:9px 10px;border:1px solid #ddd;border-radius:9px;font-size:13px;background:#fff}
.btn-save-atas{background:#0A2F52;color:#fff;border:0;padding:10px 16px;border-radius:9px;font-weight:900;font-size:13px;cursor:pointer;white-space:nowrap;height:39px}
.card-bawah{background:#fff;border-radius:12px;padding:16px;margin-top:12px}
label{font-size:12px;font-weight:700;color:#333;display:block;margin-top:10px}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin-top:5px;font-size:13px;background:#fff}
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
.ringkasan{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.ring-box{padding:12px;border-radius:10px;text-align:center}
.ring-box small{font-size:11px;display:block}
.ring-box b{font-size:16px}
.ring-masuk{background:#D9F7D9;color:#1A7A1A}
.ring-keluar{background:#FFE0E0;color:#B00000}
.ring-saldo{background:#FFF3CD;color:#8A6D00}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee;font-size:13px}
.item:last-child{border-bottom:0}
.badge{font-size:11px;font-weight:900;padding:4px 8px;border-radius:6px}
.badge-masuk{background:#D9F7D9;color:#1A7A1A}
.badge-keluar{background:#FFE0E0;color:#B00000}
@media(max-width:800px){.form-atas{grid-template-columns:1fr 1fr}.btn-save-atas{grid-column:span 2;width:100%}.ringkasan{grid-template-columns:1fr}.topbar h1{font-size:14px}.card-atas{top:50px}}
</style></head>
<body>

<div class="topbar">
<button class="btn-back" onclick="window.location='index.html'">← 🏠 Dashboard</button>
<h1>💰 Finance - INDONUSA MARINE</h1>
<span id="statusSync" style="font-size:11px;font-weight:800;color:#000">⏳...</span>
</div>

<div class="wrap">

<!-- ⭐ CARD 1 - ATAS - KECIL + DIKUNCI ⭐ -->
<div class="card-atas">
<h3>💰 Finance - <span id="judulKapal">Pilih Kapal</span></h3>
<div class="form-atas">
<div><label>Nama Kapal</label><input id="namaKapal" placeholder="MY SEAHORSE" oninput="document.getElementById('pilihKapal').value='';updateJudul()"></div>
<div><label>Pilih Kapal</label><select id="pilihKapal" onchange="onPilihKapal()"><option value="">-- Pilih Kapal --</option></select></div>
<button class="btn-save-atas" onclick="simpanFinance()">💾 SAVE DATA</button>
</div>
<p id="debug" style="font-size:11px;color:#666;margin:6px 0 0"></p>
</div>

<!-- ⭐ CARD 2 - BAWAH - SCROLL ⭐ -->
<div class="card-bawah">
<h3 style="margin:0">💰 Tambah Pemasukan / Pengeluaran</h3>

<div class="ringkasan">
<div class="ring-box ring-masuk"><small>🟢 Pemasukan</small><b id="totalMasuk">Rp 0</b></div>
<div class="ring-box ring-keluar"><small>🔴 Pengeluaran</small><b id="totalKeluar">Rp 0</b></div>
<div class="ring-box ring-saldo"><small>🟡 Saldo</small><b id="totalSaldo">Rp 0</b></div>
</div>

<label>Jenis</label>
<select id="jenis"><option value="Pemasukan">🟢 Pemasukan</option><option value="Pengeluaran">🔴 Pengeluaran</option></select>

<label>Jumlah (Rp) - Ketik manual beb, bebas digit!</label>
<input id="jumlah" type="text" inputmode="numeric" placeholder="Ketik: 1000000" oninput="this.value=this.value.replace(/[^0-9]/g,'');updatePreview()">
<p id="previewJumlah" style="font-size:12px;color:#1A7A1A;font-weight:800;margin:4px 0 0">Preview: Rp 0</p>

<label>Tanggal</label><input id="tgl" type="date">
<label>Keterangan</label><input id="ket" placeholder="Ketik: Biaya clearance / Gaji crew / dll">

<h3 style="margin:18px 0 6px">📋 Daftar Finance - <span id="kapalAktif">Semua Kapal</span></h3>
<label>Filter Kapal</label>
<select id="filterKapal" onchange="renderList()"><option value="">-- 🌐 Semua Kapal --</option></select>
<input placeholder="🔍 Cari finance..." id="cari" oninput="renderList()" style="margin-top:8px">
<div id="list"></div>
</div>

</div>
<script>
const firebaseConfig = { apiKey: "AIzaSyBI79kjr4WGpmh3OvUxKXcgRao8PMCcxIY", authDomain: "fir-panjepun.firebaseapp.com", projectId: "fir-panjepun", storageBucket: "fir-panjepun.firebasestorage.app", messagingSenderId: "399104502129", appId: "1:399104502129:web:3230853484a64d220c2ed0" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let DB = { kapal:[], clear:{}, clearance:{}, crewChange:{}, provision:{}, finance:{}, insiden:[], videos:[], master:{} };
try{ let l=JSON.parse(localStorage.getItem('INDONUSA_DB')||'{}'); if(l&&typeof l==='object') DB=Object.assign(DB,l); }catch(e){}
if(!DB.finance) DB.finance={};
// Kalau finance lama masih array, ubah jadi per kapal beb biar nggak ilang
if(Array.isArray(DB.finance)){ let lama=DB.finance; DB.finance={}; if(lama.length) DB.finance['Tanpa Kapal']=lama; }
function rp(n){ n=Number(n)||0; return 'Rp '+n.toLocaleString('id-ID'); }
function updateJudul(){ document.getElementById('judulKapal').innerText=document.getElementById('namaKapal').value||'Pilih Kapal'; }
function updatePreview(){ document.getElementById('previewJumlah').innerText='Preview: '+rp(document.getElementById('jumlah').value); }
function simpanDB(){
  document.getElementById('statusSync').innerText='⏳ Menyimpan...';
  localStorage.setItem('INDONUSA_DB', JSON.stringify(DB));
  return db.collection("indonusa").doc("data_utama").set(DB).then(()=>{ document.getElementById('statusSync').innerText='✅ Tersimpan ke Firebase'; }).catch(e=>{ document.getElementById('statusSync').innerText='❌ Gagal: '+e.message; alert('GAGAL SAVE BEB!\n'+e.message); });
}
db.collection("indonusa").doc("data_utama").onSnapshot(function(doc){
  if(doc.exists){ let d=doc.data()||{}; DB=Object.assign(DB,d); if(!DB.finance) DB.finance={}; if(Array.isArray(DB.finance)){ let lama=DB.finance; DB.finance={}; if(lama.length) DB.finance['Tanpa Kapal']=lama; } localStorage.setItem('INDONUSA_DB', JSON.stringify(DB)); }
  document.getElementById('statusSync').innerText='🟢 Firebase Aktif - '+(DB.kapal||[]).length+' kapal';
  isiKapal(); renderList();
});
function isiKapal(){
  let s=document.getElementById('pilihKapal'); let f=document.getElementById('filterKapal');
  let v=s.value, fv=f.value;
  s.innerHTML='<option value="">-- Pilih Kapal --</option>'+(DB.kapal||[]).map(k=>`<option value="${k.nama}">${k.nama}</option>`).join('');
  f.innerHTML='<option value="">-- 🌐 Semua Kapal --</option>'+(DB.kapal||[]).map(k=>`<option value="${k.nama}">${k.nama}</option>`).join('');
  if(v) s.value=v; if(fv) f.value=fv;
}
function onPilihKapal(){ let v=document.getElementById('pilihKapal').value; if(v){ document.getElementById('namaKapal').value=v; updateJudul(); } }
function getAllFinance(){
  let arr=[];
  Object.keys(DB.finance||{}).forEach(kapal=>{ (DB.finance[kapal]||[]).forEach(x=>arr.push({...x, kapal:kapal})); });
  return arr;
}
function simpanFinance(){
  let kapal=document.getElementById('namaKapal').value.trim();
  if(!kapal){ alert('Isi Nama Kapal dulu beb!'); return; }
  let jenis=document.getElementById('jenis').value;
  let jumlah=document.getElementById('jumlah').value.trim();
  if(!jumlah || Number(jumlah)<=0){ alert('Isi Jumlah dulu beb! Contoh: 1000000'); return; }
  let tgl=document.getElementById('tgl').value || new Date().toISOString().slice(0,10);
  let ket=document.getElementById('ket').value.trim();
  if(!DB.finance[kapal]) DB.finance[kapal]=[];
  DB.finance[kapal].push({id:'F'+Date.now()+Math.random().toString().slice(2,6), jenis:jenis, jumlah:jumlah, tgl:tgl, ket:ket, kapal:kapal});
  document.getElementById('debug').innerText='Menyimpan: '+kapal+' | '+jenis+' | '+rp(jumlah);
  simpanDB().then(()=>{ document.getElementById('jumlah').value=''; document.getElementById('ket').value=''; updatePreview(); renderList(); alert('BERHASIL BEB! ✅\nFinance '+kapal+' tersimpan!\n'+jenis+' - '+rp(jumlah)); });
}
function hapusItem(kapal,id){ if(!confirm('Hapus finance ini beb?'))return; if(DB.finance[kapal]) DB.finance[kapal]=DB.finance[kapal].filter(x=>x.id!==id); simpanDB().then(()=>renderList()); }
function renderList(){
  isiKapal();
  let q=(document.getElementById('cari').value||'').toLowerCase();
  let f=document.getElementById('filterKapal').value;
  document.getElementById('kapalAktif').innerText=f||'Semua Kapal';
  let all=getAllFinance();
  let tampil=all.filter(x=>{ if(f && x.kapal!==f) return false; if(q && !JSON.stringify(x).toLowerCase().includes(q)) return false; return true; });
  let masuk=tampil.filter(x=>x.jenis==='Pemasukan').reduce((a,x)=>a+(Number(x.jumlah)||0),0);
  let keluar=tampil.filter(x=>x.jenis==='Pengeluaran').reduce((a,x)=>a+(Number(x.jumlah)||0),0);
  document.getElementById('totalMasuk').innerText=rp(masuk);
  document.getElementById('totalKeluar').innerText=rp(keluar);
  document.getElementById('totalSaldo').innerText=rp(masuk-keluar);
  let html='';
  tampil.slice().reverse().forEach(x=>{
    html+=`<div class="item"><div><b>${x.ket||x.jenis}</b> <span class="badge ${x.jenis==='Pemasukan'?'badge-masuk':'badge-keluar'}">${x.jenis==='Pemasukan'?'🟢 Pemasukan':'🔴 Pengeluaran'} - ${rp(x.jumlah)}</span><br><small style="color:#666">🚢 ${x.kapal} | 📅 ${x.tgl||'-'}</small></div><button style="border:0;border-radius:8px;background:#FFE0E0;color:#B00000;font-weight:900;cursor:pointer;padding:6px 12px;font-size:12px" onclick="hapusItem('${x.kapal}','${x.id}')">🗑️ Hapus</button></div>`;
  });
  document.getElementById('list').innerHTML=html||'<p style="font-size:13px;color:#888">Belum ada finance tersimpan beb!</p>';
}
document.getElementById('tgl').value=new Date().toISOString().slice(0,10);
isiKapal(); renderList();
</script></body></html>
