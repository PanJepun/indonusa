<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crew Change - INDONUSA</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:'Segoe UI',Arial;background:#EEF2F7;color:#222}
.topbar{background:linear-gradient(90deg,#d4af37 0%,#f7eb81 100%);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200}
.topbar h1{margin:0;font-size:16px;color:#000;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-back{background:#0A2F52;color:#fff;border:0;padding:9px 14px;border-radius:50px;font-weight:800;cursor:pointer;font-size:13px;white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
.card-atas{background:#fff;border-radius:12px;padding:12px 14px;position:sticky;top:52px;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,.12);border:1px solid #E6C87A}
.card-atas h3{margin:0 0 8px;font-size:15px}
.form-atas{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end}
.form-atas label{font-size:11px;font-weight:800;color:#555;display:block;margin-bottom:3px}
.form-atas input,.form-atas select{width:100%;padding:9px 10px;border:1px solid #ddd;border-radius:9px;font-size:13px;background:#fff}
.btn-save{background:#0A2F52;color:#fff;border:0;padding:10px 16px;border-radius:9px;font-weight:900;cursor:pointer;font-size:13px;white-space:nowrap;height:39px}
.btn-save:hover{background:#000}
.card-bawah{background:#fff;border-radius:12px;padding:16px;margin-top:12px}
.card-bawah h3{margin:14px 0 8px;font-size:15px}
.card-bawah h3:first-child{margin-top:0}
.btn-tambah-on{background:#F5B301;color:#000;border:0;padding:11px;border-radius:10px;font-weight:900;width:100%;margin-top:8px;cursor:pointer}
.btn-tambah-off{background:#FF6B6B;color:#fff;border:0;padding:11px;border-radius:10px;font-weight:900;width:100%;margin-top:8px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 38px 38px;gap:8px;margin-top:8px}
.row input,.row select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:13px;margin:0}
.btn-mini{border:0;border-radius:10px;font-weight:900;cursor:pointer;font-size:18px}
.btn-plus{background:#1EA0FF;color:#fff}
.btn-min{background:#FFE0E0;color:#B00000}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee;font-size:13px}
.item:last-child{border-bottom:0}
.badge-on{background:#D9F7D9;color:#1A7A1A;font-size:11px;font-weight:900;padding:4px 8px;border-radius:6px}
.badge-off{background:#FFE0E0;color:#B00000;font-size:11px;font-weight:900;padding:4px 8px;border-radius:6px}
input,select{font-family:inherit}
label{font-size:12px;font-weight:700;color:#333;display:block;margin-top:10px}
input[type=text],select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin-top:5px}
@media(max-width:800px){
  .form-atas{grid-template-columns:1fr 1fr}
  .btn-save{grid-column:span 2;width:100%}
  .row{grid-template-columns:1fr 1fr}
  .topbar h1{font-size:14px}
  .card-atas{top:50px}
}
</style></head>
<body>

<div class="topbar">
<button class="btn-back" onclick="window.location='index.html'">← 🏠 Dashboard</button>
<h1>👨‍✈️ Crew Change - INDONUSA MARINE</h1>
<span id="statusSync" style="font-size:11px;font-weight:800;color:#000">⏳...</span>
</div>

<div class="wrap">

<div class="card-atas">
<h3>👨‍✈️ Crew Change - <span id="judulKapal">Pilih Kapal</span></h3>
<div class="form-atas">
<div><label>Nama Kapal</label><input id="namaKapal" placeholder="Symphony of the seas" oninput="document.getElementById('pilihKapal').value='';updateJudul()"></div>
<div><label>Pilih Kapal</label><select id="pilihKapal" onchange="onPilihKapal()"><option value="">-- Pilih Kapal --</option></select></div>
<div><label>Tanggal / Flight</label><input id="flight" placeholder="28 Nov, GA 123 DPS - SIN"></div>
<button class="btn-save" onclick="simpanCrew()">💾 SAVE DATA</button>
</div>
<p id="debug" style="font-size:11px;color:#666;margin:6px 0 0"></p>
</div>

<div class="card-bawah">
<h3>🟢 CREW ON (<span id="jmlOn">0</span>)</h3>
<div id="onForm"></div>
<button class="btn-tambah-on" onclick="tambahBaris('on')">➕ + TAMBAH ON</button>

<h3>🔴 CREW OFF (<span id="jmlOff">0</span>)</h3>
<div id="offForm"></div>
<button class="btn-tambah-off" onclick="tambahBaris('off')">➕ + TAMBAH OFF</button>

<h3>📋 Daftar Crew Tersimpan - <span id="kapalAktif">Semua Kapal</span></h3>
<label>Filter Kapal</label>
<select id="filterKapal" onchange="renderList()"><option value="">-- 🌐 Semua Kapal --</option></select>
<input placeholder="🔍 Cari crew..." id="cari" oninput="renderList()" style="margin-top:8px">
<div id="list"></div>
</div>

</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyBI79kjr4WGpmh3OvUxKXcgRao8PMCcxIY", authDomain: "fir-panjepun.firebaseapp.com", projectId: "fir-panjepun", storageBucket: "fir-panjepun.firebasestorage.app", messagingSenderId: "399104502129", appId: "1:399104502129:web:3230853484a64d220c2ed0" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let DB = { kapal:[], clear:{}, clearance:{}, crewChange:{}, provision:{}, finance:{}, insiden:[], videos:[], master:{} };
try{ let l=JSON.parse(localStorage.getItem('INDONUSA_DB')||'{}'); if(l&&typeof l==='object') DB=Object.assign(DB,l); }catch(e){}
if(!DB.crewChange) DB.crewChange={};
let onRows=[{nama:'',passport:'',jabatan:'',negara:'Indonesia'}];
let offRows=[{nama:'',passport:'',jabatan:'',negara:'Indonesia'}];
// ⭐ HELPER BEB - CUMA KAPAL YANG MASIH SANDAR BEB, YANG UDAH DEPARTURE DI-SKIP BEB ⭐
function getKapalAktif(){ return (DB.kapal||[]).filter(k=>k.status!=='DEPARTURE'); }
function updateJudul(){ document.getElementById('judulKapal').innerText=document.getElementById('namaKapal').value||'Pilih Kapal'; }
function simpanDB(){
  document.getElementById('statusSync').innerText='⏳ Menyimpan...';
  localStorage.setItem('INDONUSA_DB', JSON.stringify(DB));
  return db.collection("indonusa").doc("data_utama").set(DB).then(()=>{ document.getElementById('statusSync').innerText='✅ Tersimpan ke Firebase'; }).catch(e=>{ document.getElementById('statusSync').innerText='❌ Gagal: '+e.message; alert('GAGAL SAVE BEB!\n'+e.message); });
}
db.collection("indonusa").doc("data_utama").onSnapshot(function(doc){
  if(doc.exists){ let d=doc.data()||{}; DB=Object.assign(DB,d); if(!DB.crewChange) DB.crewChange={}; localStorage.setItem('INDONUSA_DB', JSON.stringify(DB)); }
  document.getElementById('statusSync').innerText='🟢 Firebase Aktif - '+(DB.kapal||[]).length+' kapal';
  isiKapal(); renderList();
});
function isiKapal(){
  let s=document.getElementById('pilihKapal'); let f=document.getElementById('filterKapal');
  let v=s.value, fv=f.value;
  // ⭐ FIX BEB - PAKAI getKapalAktif() BEB, JADI KAPAL UDAH DEPARTURE LANGSUNG HILANG DARI 2 DROPDOWN BEB ⭐
  s.innerHTML='<option value="">-- Pilih Kapal --</option>'+getKapalAktif().map(k=>`<option value="${k.nama}">${k.nama} - Voyage #${k.voyage||1}</option>`).join('');
  f.innerHTML='<option value="">-- 🌐 Semua Kapal --</option>'+getKapalAktif().map(k=>`<option value="${k.nama}">${k.nama} - Voyage #${k.voyage||1}</option>`).join('');
  if(v && getKapalAktif().some(k=>k.nama===v)) s.value=v; else if(v) s.value='';
  if(fv && getKapalAktif().some(k=>k.nama===fv)) f.value=fv; else if(fv) f.value='';
}
function onPilihKapal(){ let v=document.getElementById('pilihKapal').value; if(v){ document.getElementById('namaKapal').value=v; updateJudul(); } }
function renderForm(){
  let buat=(arr,tipe)=>arr.map((r,i)=>`<div class="row"><input placeholder="Nama *" value="${r.nama}" oninput="updateRow('${tipe}',${i},'nama',this.value)"><input placeholder="Passport *" value="${r.passport}" oninput="updateRow('${tipe}',${i},'passport',this.value)"><input placeholder="Jabatan" value="${r.jabatan}" oninput="updateRow('${tipe}',${i},'jabatan',this.value)"><select onchange="updateRow('${tipe}',${i},'negara',this.value)"><option ${r.negara==='Indonesia'?'selected':''}>Indonesia</option><option ${r.negara==='Philippines'?'selected':''}>Philippines</option><option ${r.negara==='India'?'selected':''}>India</option><option ${r.negara==='Myanmar'?'selected':''}>Myanmar</option><option ${r.negara==='Lainnya'?'selected':''}>Lainnya</option></select><button class="btn-mini btn-plus" onclick="tambahBaris('${tipe}')">+</button><button class="btn-mini btn-min" onclick="hapusBaris('${tipe}',${i})">-</button></div>`).join('');
  document.getElementById('onForm').innerHTML=buat(onRows,'on');
  document.getElementById('offForm').innerHTML=buat(offRows,'off');
  document.getElementById('jmlOn').innerText=onRows.filter(r=>r.nama).length;
  document.getElementById('jmlOff').innerText=offRows.filter(r=>r.nama).length;
}
function updateRow(tipe,i,k,v){ if(tipe==='on') onRows[i][k]=v; else offRows[i][k]=v; }
function tambahBaris(tipe){ if(tipe==='on') onRows.push({nama:'',passport:'',jabatan:'',negara:'Indonesia'}); else offRows.push({nama:'',passport:'',jabatan:'',negara:'Indonesia'}); renderForm(); }
function hapusBaris(tipe,i){ if(tipe==='on'){ if(onRows.length>1) onRows.splice(i,1); } else { if(offRows.length>1) offRows.splice(i,1); } renderForm(); }
function simpanCrew(){
  let kapal=document.getElementById('namaKapal').value.trim();
  if(!kapal){ alert('Isi Nama Kapal dulu beb!'); return; }
  let flight=document.getElementById('flight').value;
  if(!DB.crewChange[kapal]) DB.crewChange[kapal]={on:[],off:[],flight:''};
  DB.crewChange[kapal].flight=flight;
  let onBaru=onRows.filter(r=>r.nama.trim()).map(r=>({id:'C'+Date.now()+Math.random().toString().slice(2,6), nama:r.nama, passport:r.passport, jabatan:r.jabatan, negara:r.negara, kebangsaan:r.negara, status:'ON', tgl:new Date().toISOString().slice(0,10), flight:flight, kapal:kapal}));
  let offBaru=offRows.filter(r=>r.nama.trim()).map(r=>({id:'C'+Date.now()+Math.random().toString().slice(2,6), nama:r.nama, passport:r.passport, jabatan:r.jabatan, negara:r.negara, kebangsaan:r.negara, status:'OFF', tgl:new Date().toISOString().slice(0,10), flight:flight, kapal:kapal}));
  if(!onBaru.length && !offBaru.length){ alert('Isi minimal 1 crew ON / OFF dulu beb!'); return; }
  DB.crewChange[kapal].on.push(...onBaru);
  DB.crewChange[kapal].off.push(...offBaru);
  document.getElementById('debug').innerText='Menyimpan: '+kapal+' | ON: '+onBaru.length+' | OFF: '+offBaru.length;
  simpanDB().then(()=>{ onRows=[{nama:'',passport:'',jabatan:'',negara:'Indonesia'}]; offRows=[{nama:'',passport:'',jabatan:'',negara:'Indonesia'}]; renderForm(); renderList(); alert('BERHASIL BEB! ✅\nCrew '+kapal+' tersimpan ke Firebase!\nON: '+onBaru.length+' | OFF: '+offBaru.length); });
}
function hapusCrew(kapal,id,tipe){ if(!confirm('Hapus crew ini beb?'))return; if(DB.crewChange[kapal]) DB.crewChange[kapal][tipe]=DB.crewChange[kapal][tipe].filter(x=>x.id!==id); simpanDB().then(()=>renderList()); }
function renderList(){
  isiKapal();
  let q=(document.getElementById('cari').value||'').toLowerCase();
  let f=document.getElementById('filterKapal').value;
  document.getElementById('kapalAktif').innerText=f||'Semua Kapal';
  let html=''; let total=0;
  Object.keys(DB.crewChange||{}).forEach(kapal=>{
    if(f && kapal!==f) return;
    ['on','off'].forEach(t=>{
      (DB.crewChange[kapal][t]||[]).forEach(c=>{
        if(q && !JSON.stringify(c).toLowerCase().includes(q)) return;
        total++; let isOn=t==='on';
        html+=`<div class="item"><div><b>${c.nama}</b> <span class="${isOn?'badge-on':'badge-off'}">${isOn?'🟢 ON':'🔴 OFF'}</span><br><small style="color:#666">🚢 ${kapal} | ${c.jabatan||'-'} | 🛂 ${c.passport||'-'} | ${c.negara||c.kebangsaan||'-'} | ✈️ ${c.flight||DB.crewChange[kapal].flight||'-'}</small></div><button class="btn-mini btn-min" style="padding:6px 12px;font-size:12px" onclick="hapusCrew('${kapal}','${c.id}','${t}')">🗑️ Hapus</button></div>`;
      });
    });
  });
  document.getElementById('list').innerHTML=html||'<p style="font-size:13px;color:#888">Belum ada crew tersimpan beb!</p>';
}
renderForm(); isiKapal(); renderList();
</script></body></html>
