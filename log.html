<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Provision & Bunker - INDONUSA</title><link rel="stylesheet" href="style.css">
<style>
.card-top{position:sticky;top:60px;z-index:100;background:#fff;padding:10px 14px !important}
.card-top-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.card-top-head h3{margin:0;font-size:16px}
.btn-save-atas{background:#F5B301;color:#000;border:0;padding:8px 14px;border-radius:8px;font-weight:900;font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.top-inputs{display:flex;gap:8px}
.top-inputs>div{flex:1}
.top-inputs label{display:block;font-size:11px;font-weight:700;margin-bottom:3px;color:#0A2F52}
.top-inputs input,.top-inputs select{width:100%;padding:8px 10px !important;font-size:13px !important;border-radius:8px !important;margin:0 !important;box-sizing:border-box}
.btn-save-bawah{width:100%;padding:13px;border:0;border-radius:10px;background:#F5B301;color:#000;font-weight:900;font-size:15px;cursor:pointer;margin-top:10px}
.card-bawah{max-height:78vh;overflow-y:auto;padding-right:4px}
.card-bawah::-webkit-scrollbar{width:8px}
.card-bawah::-webkit-scrollbar-thumb{background:#0A2F52;border-radius:10px}
.btn-baru{background:#8ED68E;color:#0A2F52;border:0;padding:9px 14px;border-radius:8px;font-weight:900;cursor:pointer}
.filter-box{display:flex;gap:8px;align-items:end;margin:10px 0;background:#F6F8FB;padding:10px;border-radius:10px;border:1px solid #ddd}
.filter-box>div{flex:1}
.filter-box label{font-size:11px;font-weight:700}
.filter-box select,.filter-box input{width:100%;padding:8px;border-radius:8px;margin-top:3px;box-sizing:border-box}
.tabel-data{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.tabel-data th,.tabel-data td{border:1px solid #ddd;padding:8px;text-align:left}
.tabel-data th{background:#0A2F52;color:#fff}
.total-box{background:#FFF3CD;padding:10px;border-radius:10px;font-weight:900;text-align:right;margin-top:10px}
@media(max-width:700px){ .card-top{top:52px} .top-inputs{flex-direction:column} .card-bawah{max-height:none} .filter-box{flex-direction:column} }
</style>
</head>
<body><div class="top"><div><b>⚓ INDONUSA MARINE</b></div></div>
<div class="wrap"><div class="menu" id="menu"></div><div class="main">

<!-- ⭐ CARD ATAS - KECIL BEB! ⭐ -->
<div class="card card-top">
  <div class="card-top-head">
    <h3>🛢️ Provision & Bunker</h3>
    <div style="display:flex;gap:8px"><button class="btn-baru" onclick="tambahBaru()">➕ + TAMBAH BARU</button><button class="btn-save-atas" onclick="simpanLogistik()">💾 SIMPAN LOGISTIK</button></div>
  </div>
  <div class="top-inputs">
    <div><label>Nama Kapal</label><input id="logKapalNama" placeholder="MY SEAHORSE"></div>
    <div><label>Pilih Kapal</label><select id="pilihLog"></select></div>
    <div><label>Tanggal</label><input type="date" id="logTgl"></div>
  </div>
  <div class="top-inputs" style="margin-top:8px">
    <div style="flex:2"><label>Item</label><input id="logItem" placeholder="Contoh: bbm 50000ltr/1 bulan, Beras 50kg, Air 1000L"></div>
    <div><label>Harga (Rp)</label><input id="logHarga" type="number" placeholder="25000000" oninput="formatHarga()"><div id="hargaTampil" style="font-size:11px;color:#0A6B0A;font-weight:700"></div></div>
  </div>
  <!-- ⭐ TOMBOL SAVE GEDE DI BAWAH JUGA BEB! ⭐ -->
  <button class="btn-save-bawah" onclick="simpanLogistik()">💾 SIMPAN LOGISTIK - KLIK DI SINI BEB!</button>
</div>

<!-- ⭐ CARD BAWAH - LAPORAN BEB! ⭐ -->
<div class="card card-bawah">
  <h3 style="margin:0">📊 LAPORAN PROVISION & BUNKER BEB</h3>
  <div class="filter-box">
    <div><label>Laporan Kapal Beb:</label><select id="filterKapal" onchange="renderLog()"><option value="SEMUA">📋 SEMUA KAPAL BEB</option></select></div>
    <div><label>Dari Tanggal</label><input type="date" id="filterDari" onchange="renderLog()"></div>
    <div><label>Sampai Tanggal</label><input type="date" id="filterSampai" onchange="renderLog()"></div>
    <div style="flex:0 0 auto"><button onclick="printLaporan()" style="padding:9px 14px;border:0;border-radius:8px;background:#0A2F52;color:#fff;font-weight:900;cursor:pointer">📄 PRINT LAPORAN BEB</button></div>
  </div>
  <div id="infoLaporan" style="font-size:13px;color:#666"></div>
  <div id="listLog"></div>
  <div id="totalLog" class="total-box"></div>
</div>

</div></div>
<script src="db.js"></script><script>menu('logistik.html'); kapalOptions('pilihLog');
if(!Array.isArray(DB.logistik)) DB.logistik=[];
if(!DB.logistik.length && DB.provision){ DB.logistik=Object.keys(DB.provision).map(n=>({kapal:n,item:DB.provision[n].item||'',harga:DB.provision[n].harga||0,tgl:''})); }
document.getElementById('logTgl').value=new Date().toISOString().slice(0,10);
document.getElementById('pilihLog').addEventListener('change', function(){let k=DB.kapal.find(x=>x.id==this.value); if(k) document.getElementById('logKapalNama').value=k.nama; });
function formatHarga(){
  let v=document.getElementById('logHarga').value;
  document.getElementById('hargaTampil').innerText=v?'Rp '+Number(v).toLocaleString('id-ID'):'';
}
function formatRp(n){ return 'Rp '+Number(n||0).toLocaleString('id-ID'); }
function tambahBaru(){
  document.getElementById('logKapalNama').value='';
  document.getElementById('pilihLog').value='';
  document.getElementById('logItem').value='';
  document.getElementById('logHarga').value='';
  document.getElementById('hargaTampil').innerText='';
  document.getElementById('logTgl').value=new Date().toISOString().slice(0,10);
  document.getElementById('logKapalNama').focus();
}
function simpanLogistik(){
  let nama=getNamaKapal('logKapalNama','pilihLog');
  if(!nama){ alert('Isi Nama Kapal dulu beb!'); return; }
  let item=document.getElementById('logItem').value.trim();
  if(!item){ alert('Isi Item dulu beb!'); return; }
  let harga=Number(document.getElementById('logHarga').value||0);
  let tgl=document.getElementById('logTgl').value||new Date().toISOString().slice(0,10);
  DB.logistik.push({id:Date.now(),kapal:nama,item:item,harga:harga,tgl:tgl,tglSimpan:new Date().toLocaleString('id-ID')});
  save(); renderLog();
  alert('BERHASIL BEB! ✅\n'+nama+' - '+item+' - '+formatRp(harga)+'\n\nUdah kesimpen beb! Mau isi lagi beb? Formnya langsung dikosongin beb!');
  document.getElementById('logItem').value='';
  document.getElementById('logHarga').value='';
  document.getElementById('hargaTampil').innerText='';
  document.getElementById('logItem').focus();
}
function hapusLog(id){
  if(confirm('Hapus data ini beb?')){ DB.logistik=DB.logistik.filter(x=>x.id!==id); save(); renderLog(); }
}
function getFiltered(){
  let fKapal=document.getElementById('filterKapal').value;
  let dari=document.getElementById('filterDari').value;
  let sampai=document.getElementById('filterSampai').value;
  let data=[...DB.logistik].reverse();
  if(fKapal!=='SEMUA') data=data.filter(x=>x.kapal===fKapal);
  if(dari) data=data.filter(x=>x.tgl>=dari);
  if(sampai) data=data.filter(x=>x.tgl<=sampai);
  return data;
}
function renderLog(){
  let kapalUnik=[...new Set(DB.logistik.map(x=>x.kapal))];
  let sel=document.getElementById('filterKapal');
  let cur=sel.value;
  sel.innerHTML='<option value="SEMUA">📋 SEMUA KAPAL BEB</option>'+kapalUnik.map(k=>`<option value="${k}">⚓ ${k} beb</option>`).join('');
  if(kapalUnik.includes(cur)) sel.value=cur;
  let data=getFiltered();
  let total=data.reduce((a,b)=>a+Number(b.harga||0),0);
  document.getElementById('infoLaporan').innerText=data.length?('Menampilkan '+data.length+' data beb - Filter: '+(document.getElementById('filterKapal').value==='SEMUA'?'Semua Kapal beb':'Kapal '+document.getElementById('filterKapal').value+' beb')):'Belum ada data beb! Isi dulu beb di atas beb!';
  if(!data.length){ document.getElementById('listLog').innerHTML=''; document.getElementById('totalLog').innerText=''; return; }
  document.getElementById('listLog').innerHTML=`<table class="tabel-data"><tr><th>Tanggal</th><th>Kapal</th><th>Item</th><th>Harga</th><th>Aksi</th></tr>${data.map(x=>`<tr><td>${x.tgl||'-'}</td><td><b>${x.kapal}</b></td><td>${x.item}</td><td>${formatRp(x.harga)}</td><td><button onclick="hapusLog(${x.id})" style="border:0;background:#FFE0E0;color:#B00000;padding:5px 8px;border-radius:6px;font-weight:800;cursor:pointer">🗑️</button></td></tr>`).join('')}</table>`;
  document.getElementById('totalLog').innerText='TOTAL: '+formatRp(total)+' ('+data.length+' item beb)';
}
function printLaporan(){
  let data=getFiltered();
  if(!data.length){ alert('Belum ada data beb!'); return; }
  let total=data.reduce((a,b)=>a+Number(b.harga||0),0);
  let fKapal=document.getElementById('filterKapal').value;
  let rows=data.map((x,i)=>`<tr><td>${i+1}</td><td>${x.tgl||'-'}</td><td>${x.kapal}</td><td>${x.item}</td><td>${formatRp(x.harga)}</td></tr>`).join('');
  let html=`<html><head><title>Laporan Provision - ${fKapal}</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #000;padding:8px}th{background:#0A2F52;color:#fff}</style></head><body><h2>⚓ PT. INDONUSA TENGGARA MARINE</h2><h3>📊 LAPORAN PROVISION & BUNKER - ${fKapal==='SEMUA'?'SEMUA KAPAL':fKapal}</h3><p>Periode: ${document.getElementById('filterDari').value||'Awal'} s/d ${document.getElementById('filterSampai').value||'Sekarang'} | Jumlah: ${data.length} item | Total: ${formatRp(total)}</p><table><tr><th>No</th><th>Tanggal</th><th>Kapal</th><th>Item</th><th>Harga</th></tr>${rows}</table><br><p style="text-align:right;font-weight:900">TOTAL: ${formatRp(total)}</p><br><br><p>Dibuat Oleh, ________________ | Disetujui, ________________</p><script>window.print()<\/script></body></html>`;
  let w=window.open('','_blank'); w.document.write(html); w.document.close();
}
renderLog();
</script></body></html>
