<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Insiden - INDONUSA</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:'Segoe UI',Arial;background:#EEF2F7;color:#222}
.topbar{background:linear-gradient(90deg,#d4af37 0%,#f7eb81 100%);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200}
.topbar h1{margin:0;font-size:16px;color:#000;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-back{background:#0A2F52;color:#fff;border:0;padding:9px 14px;border-radius:50px;font-weight:800;cursor:pointer;font-size:13px;white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
.card-atas{background:#fff;border-radius:12px;padding:12px 14px;position:sticky;top:52px;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,.12);border:1px solid #E6C87A}
.card-atas h3{margin:0 0 8px;font-size:15px}
.form-atas-kapal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-atas-kapal label{font-size:11px;font-weight:800;color:#555;display:block;margin-bottom:3px}
.form-atas-kapal input,.form-atas-kapal select{width:100%;padding:9px 10px;border:1px solid #ddd;border-radius:9px;font-size:13px;background:#fff}
.btn-save-atas{background:#0A2F52;color:#fff;border:0;padding:11px;border-radius:9px;font-weight:900;font-size:14px;cursor:pointer;width:100%;margin-top:8px}
.card-bawah{background:#fff;border-radius:12px;padding:16px;margin-top:12px}
label{font-size:12px;font-weight:700;color:#333;display:block;margin-top:10px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin-top:5px;font-size:13px;background:#fff;font-family:inherit}
textarea{min-height:90px;resize:vertical}
.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee;font-size:13px}
.item:last-child{border-bottom:0}
.badge{font-size:11px;font-weight:900;padding:4px 8px;border-radius:6px}
.badge-baru{background:#FFE0E0;color:#B00000}
.badge-proses{background:#FFF3CD;color:#8A6D00}
.badge-selesai{background:#D9F7D9;color:#1A7A1A}
.btn-foto{background:#1EA0FF;color:#fff;border:0;padding:11px;border-radius:10px;font-weight:900;width:100%;cursor:pointer;font-size:13px;margin-top:5px}
.preview-foto{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.foto-item{position:relative;width:90px;height:90px;border-radius:10px;overflow:hidden;border:2px solid #ddd}
.foto-item img{width:100%;height:100%;object-fit:cover}
.foto-item button{position:absolute;top:2px;right:2px;background:#B00000;color:#fff;border:0;width:22px;height:22px;border-radius:50%;font-weight:900;cursor:pointer;font-size:12px;line-height:1}
.foto-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.foto-list img{width:70px;height:70px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid #ddd}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;padding:12px;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:12px;width:100%;max-width:900px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#0A2F52;color:#fff}
.modal-head button{background:#FFE0E0;color:#B00000;border:0;width:32px;height:32px;border-radius:50%;font-weight:900;cursor:pointer;font-size:16px}
.modal-body{flex:1;overflow:auto;padding:10px;background:#000;text-align:center}
.modal-body img{max-width:100%;max-height:70vh;border-radius:8px}
@media(max-width:800px){.form-atas-kapal{grid-template-columns:1fr}.topbar h1{font-size:14px}.card-atas{top:50px}}
</style></head>
<body>

<div class="topbar">
<button class="btn-back" onclick="window.location='index.html'">← 🏠 Dashboard</button>
<h1>🚨 Insiden - INDONUSA MARINE</h1>
<span id="statusSync" style="font-size:11px;font-weight:800;color:#000">⏳...</span>
</div>

<div class="wrap">

<div class="card-atas">
<h3>🚨 Insiden - <span id="judulKapal">Pilih Kapal</span></h3>
<div class="form-atas-kapal">
<div><label>Nama Kapal</label><input id="namaKapal" placeholder="MY SEAHORSE" oninput="document.getElementById('pilihKapal').value='';updateJudul()"></div>
<div><label>Pilih Kapal</label><select id="pilihKapal" onchange="onPilihKapal()"><option value="">-- Pilih Kapal --</option></select></div>
</div>
<button class="btn-save-atas" onclick="simpanInsiden()">💾 SAVE DATA</button>
<p id="debug" style="font-size:11px;color:#666;margin:6px 0 0"></p>
</div>

<div class="card-bawah">
<h3 style="margin:0">🚨 Tambah Insiden</h3>
<label>Jenis Insiden</label>
<select id="jenis"><option value="Crew Sakit">🤒 Crew Sakit</option><option value="Kecelakaan">💥 Kecelakaan</option><option value="Kerusakan Mesin">🔧 Kerusakan Mesin</option><option value="Keterlambatan">⏰ Keterlambatan</option><option value="Cuaca Buruk">🌊 Cuaca Buruk</option><option value="Lainnya">📝 Lainnya</option></select>
<label>Tanggal</label><input id="tgl" type="date">
<label>Status</label>
<select id="status"><option value="Baru">🔴 Baru</option><option value="Diproses">🟡 Diproses</option><option value="Selesai">🟢 Selesai</option></select>
<label>Keterangan</label><textarea id="ket" placeholder="Ceritakan kejadiannya beb..."></textarea>

<label>📸 Foto Insiden - Bisa lebih dari 1 beb!</label>
<input type="file" id="inputFoto" accept="image/*" multiple style="display:none" onchange="tambahFoto(this)">
<button class="btn-foto" onclick="document.getElementById('inputFoto').click()">📸 + TAMBAH FOTO (Bisa Banyak Sekaligus)</button>
<p style="font-size:11px;color:#888;margin:4px 0 0">Pilih banyak foto sekaligus beb, tahan / centang banyak foto di galeri, langsung masuk semua!</p>
<div class="preview-foto" id="previewFoto"></div>

<h3 style="margin:18px 0 6px">📋 Daftar Insiden - <span id="kapalAktif">Semua Kapal</span></h3>
<label>Filter Kapal</label>
<select id="filterKapal" onchange="renderList()"><option value="">-- 🌐 Semua Kapal --</option></select>
<input placeholder="🔍 Cari insiden..." id="cari" oninput="renderList()" style="margin-top:8px">
<div id="list"></div>
</div>

</div>

<div class="modal" id="modalFoto" onclick="if(event.target===this) tutupModalFoto()">
<div class="modal-box">
<div class="modal-head"><b id="modalFotoJudul">📸 Foto</b><button onclick="tutupModalFoto()">✕</button></div>
<div class="modal-body"><img id="modalFotoImg" src=""></div>
<div style="padding:10px;display:flex;gap:8px;background:#fff">
<button onclick="downloadFotoAktif()" style="flex:1;padding:11px;border:0;border-radius:10px;background:#F5B301;font-weight:900;cursor:pointer">⬇️ DOWNLOAD FOTO</button>
<button onclick="tutupModalFoto()" style="flex:1;padding:11px;border:0;border-radius:10px;background:#eee;font-weight:700;cursor:pointer">❌ TUTUP</button>
</div>
</div>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyBI79kjr4WGpmh3OvUxKXcgRao8PMCcxIY", authDomain: "fir-panjepun.firebaseapp.com", projectId: "fir-panjepun", storageBucket: "fir-panjepun.firebasestorage.app", messagingSenderId: "399104502129", appId: "1:399104502129:web:3230853484a64d220c2ed0" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let DB = { kapal:[], clear:{}, clearance:{}, crewChange:{}, provision:{}, finance:{}, insiden:[], videos:[], master:{} };
try{ let l=JSON.parse(localStorage.getItem('INDONUSA_DB')||'{}'); if(l&&typeof l==='object') DB=Object.assign(DB,l); }catch(e){}
if(!DB.insiden) DB.insiden=[];
if(!Array.isArray(DB.insiden)){ let lama=DB.insiden; DB.insiden=[]; Object.keys(lama||{}).forEach(kapal=>{ (lama[kapal]||[]).forEach(x=>DB.insiden.push({...x, kapal:kapal})); }); }
let fotoBaru=[];
let fotoAktif='';
// ⭐ HELPER BEB - CUMA KAPAL YANG MASIH SANDAR BEB, YANG UDAH DEPARTURE DI-SKIP BEB ⭐
function getKapalAktif(){ return (DB.kapal||[]).filter(k=>k.status!=='DEPARTURE'); }
function updateJudul(){ document.getElementById('judulKapal').innerText=document.getElementById('namaKapal').value||'Pilih Kapal'; }
function simpanDB(){
  document.getElementById('statusSync').innerText='⏳ Menyimpan...';
  localStorage.setItem('INDONUSA_DB', JSON.stringify(DB));
  return db.collection("indonusa").doc("data_utama").set(DB).then(()=>{ document.getElementById('statusSync').innerText='✅ Tersimpan ke Firebase'; }).catch(e=>{ document.getElementById('statusSync').innerText='❌ Gagal: '+e.message; alert('GAGAL SAVE BEB!\n'+e.message); });
}
db.collection("indonusa").doc("data_utama").onSnapshot(function(doc){
  if(doc.exists){ let d=doc.data()||{}; DB=Object.assign(DB,d); if(!DB.insiden) DB.insiden=[]; if(!Array.isArray(DB.insiden)){ let lama=DB.insiden; DB.insiden=[]; Object.keys(lama||{}).forEach(kapal=>{ (lama[kapal]||[]).forEach(x=>DB.insiden.push({...x, kapal:kapal})); }); } localStorage.setItem('INDONUSA_DB', JSON.stringify(DB)); }
  document.getElementById('statusSync').innerText='🟢 Firebase Aktif - '+(DB.kapal||[]).length+' kapal';
  isiKapal(); renderList();
});
function isiKapal(){
  let s=document.getElementById('pilihKapal'); let f=document.getElementById('filterKapal');
  let v=s.value, fv=f.value;
  // ⭐ FIX BEB - PAKAI getKapalAktif() BEB, JADI KAPAL UDAH DEPARTURE LANGSUNG HILANG DARI 2 DROPDOWN BEB ⭐
  s.innerHTML='<option value="">-- Pilih Kapal --</option>'+getKapalAktif().map(k=>`<option value="${k.nama}">${k.nama} - Voyage #${k.voyage||1}</option>`).join('');
  f.innerHTML='<option value="">-- 🌐 Semua Kapal --</option>'+getKapalAktif().map(k=>`<option value="${k.nama}">${k.nama} - Voyage #${k.voyage||1}</option>`).join('');
  if(v && getKapalAktif().some(k=>k.nama===v)) s.value=v; else if(v) s.value='';
  if(fv && getKapalAktif().some(k=>k.nama===fv)) f.value=fv; else if(fv) f.value='';
}
function onPilihKapal(){ let v=document.getElementById('pilihKapal').value; if(v){ document.getElementById('namaKapal').value=v; updateJudul(); } }
function kompresFoto(file){
  return new Promise((resolve)=>{
    let reader=new FileReader();
    reader.onload=(e)=>{
      let img=new Image();
      img.onload=()=>{
        let canvas=document.createElement('canvas');
        let max=900; let w=img.width, h=img.height;
        if(w>max || h>max){ let ratio=Math.min(max/w, max/h); w=Math.round(w*ratio); h=Math.round(h*ratio); }
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.75));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function tambahFoto(input){
  let files=[...input.files];
  if(!files.length) return;
  document.getElementById('debug').innerText='⏳ Memproses '+files.length+' foto beb...';
  for(let f of files){
    let data=await kompresFoto(f);
    fotoBaru.push(data);
  }
  input.value='';
  renderPreviewFoto();
  document.getElementById('debug').innerText='✅ '+fotoBaru.length+' foto siap di SAVE beb!';
}
function renderPreviewFoto(){
  document.getElementById('previewFoto').innerHTML=fotoBaru.map((f,i)=>`<div class="foto-item"><img src="${f}" onclick="bukaFoto('${f}','Foto ${i+1}')"><button onclick="hapusFotoBaru(${i})">✕</button></div>`).join('')+(fotoBaru.length?`<p style="font-size:11px;color:#1A7A1A;font-weight:800;width:100%;margin:0">✅ ${fotoBaru.length} foto dipilih - klik ✕ buat hapus 1 foto beb!</p>`:'');
}
function hapusFotoBaru(i){ fotoBaru.splice(i,1); renderPreviewFoto(); }
function bukaFoto(data, judul){
  fotoAktif=data;
  document.getElementById('modalFotoJudul').innerText='📸 '+judul;
  document.getElementById('modalFotoImg').src=data;
  document.getElementById('modalFoto').classList.add('show');
}
function tutupModalFoto(){ document.getElementById('modalFoto').classList.remove('show'); }
function downloadFotoAktif(){
  if(!fotoAktif) return;
  let a=document.createElement('a'); a.href=fotoAktif; a.download='insiden-foto.jpg'; document.body.appendChild(a); a.click(); a.remove();
}
function simpanInsiden(){
  let kapal=document.getElementById('namaKapal').value.trim();
  if(!kapal){ alert('Isi Nama Kapal dulu beb!'); return; }
  let jenis=document.getElementById('jenis').value;
  let tgl=document.getElementById('tgl').value || new Date().toISOString().slice(0,10);
  let status=document.getElementById('status').value;
  let ket=document.getElementById('ket').value.trim();
  if(!ket){ alert('Isi Keterangan dulu beb! Ceritakan kejadiannya!'); return; }
  DB.insiden.push({id:'I'+Date.now()+Math.random().toString().slice(2,6), kapal:kapal, jenis:jenis, tgl:tgl, status:status, ket:ket, fotos:[...fotoBaru]});
  document.getElementById('debug').innerText='Menyimpan: '+kapal+' | '+jenis+' | '+status+' | '+fotoBaru.length+' foto';
  simpanDB().then(()=>{ document.getElementById('ket').value=''; fotoBaru=[]; renderPreviewFoto(); renderList(); alert('BERHASIL BEB! ✅\nInsiden '+kapal+' tersimpan!\n'+jenis+' - '+status+'\n📸 '+ (DB.insiden[DB.insiden.length-1].fotos||[]).length +' foto'); });
}
function hapusItem(id){ if(!confirm('Hapus insiden ini beb?'))return; DB.insiden=DB.insiden.filter(x=>x.id!==id); simpanDB().then(()=>renderList()); }
function ubahStatus(id, statusBaru){
  let x=DB.insiden.find(v=>v.id===id); if(x){ x.status=statusBaru; simpanDB().then(()=>renderList()); }
}
function renderList(){
  isiKapal();
  let q=(document.getElementById('cari').value||'').toLowerCase();
  let f=document.getElementById('filterKapal').value;
  document.getElementById('kapalAktif').innerText=f||'Semua Kapal';
  let tampil=(DB.insiden||[]).filter(x=>{ if(f && x.kapal!==f) return false; if(q && !JSON.stringify(x).toLowerCase().includes(q)) return false; return true; });
  let html='';
  tampil.slice().reverse().forEach(x=>{
    let badge = x.status==='Selesai'?'badge-selesai':(x.status==='Diproses'?'badge-proses':'badge-baru');
    let fotos=x.fotos||(x.foto?[x.foto]:[]);
    let fotoHtml=fotos.length?`<div class="foto-list">${fotos.map((ft,idx)=>`<img src="${ft}" onclick="bukaFoto('${ft}','${x.kapal} - Foto ${idx+1}')">`).join('')}</div><small style="color:#888">📸 ${fotos.length} foto - klik foto buat gedein beb!</small>`:'';
    html+=`<div class="item"><div style="flex:1"><b>${x.jenis}</b> <span class="badge ${badge}">${x.status}</span><br><small style="color:#666">🚢 ${x.kapal} | 📅 ${x.tgl||'-'}</small><br><span style="color:#333">${x.ket||''}</span><br>${fotoHtml}<br><select style="width:auto;margin-top:6px;padding:6px;font-size:12px" onchange="ubahStatus('${x.id}',this.value)"><option value="Baru" ${x.status==='Baru'?'selected':''}>🔴 Baru</option><option value="Diproses" ${x.status==='Diproses'?'selected':''}>🟡 Diproses</option><option value="Selesai" ${x.status==='Selesai'?'selected':''}>🟢 Selesai</option></select></div><button style="border:0;border-radius:8px;background:#FFE0E0;color:#B00000;font-weight:900;cursor:pointer;padding:6px 12px;font-size:12px;height:fit-content" onclick="hapusItem('${x.id}')">🗑️ Hapus</button></div>`;
  });
  document.getElementById('list').innerHTML=html||'<p style="font-size:13px;color:#888">Belum ada insiden tersimpan beb!</p>';
}
document.getElementById('tgl').value=new Date().toISOString().slice(0,10);
isiKapal(); renderList();
</script></body></html>
